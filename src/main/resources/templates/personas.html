<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Personas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .navbar .nav-link { color: rgb(255 255 255 / 60%); }
        .navbar .nav-link:hover { color: #fff; }
        .navbar .nav-link.active { color: var(--accent); font-weight: 700; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/libros}">BIBLIOTECA</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/vista/libros}">Libros</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/vista/personas}">Personas</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/vista/prestamos}">Prestamos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administracion</p>
                <h1 class="h2 mb-0">Personas</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(personas)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar persona</h2>
                    <form th:action="@{/vista/personas/guardar}" th:object="${persona}" method="post">
                        <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}" required></div>
                        <div class="mb-3"><label class="form-label" for="apellidoPaterno">Apellido Paterno</label><input id="apellidoPaterno" class="form-control" th:field="*{apellidoPaterno}" required></div>
                        <div class="mb-3"><label class="form-label" for="apellidoMaterno">Apellido Materno</label><input id="apellidoMaterno" class="form-control" th:field="*{apellidoMaterno}" required></div>
                        <div class="mb-3"><label class="form-label" for="fechaNacimiento">Fecha de Nacimiento</label><input type="date" id="fechaNacimiento" class="form-control" th:field="*{fechaNacimiento}" required></div>
                        <div class="mb-3"><label class="form-label" for="correoElectronico">Email</label><input id="correoElectronico" class="form-control" th:field="*{correoElectronico}" required></div>
                        <div class="mb-3"><label class="form-label" for="telefono">Telefono</label><input id="telefono" class="form-control" th:field="*{telefono}" required></div>
                        <div class="mb-3"><label class="form-label" for="direccion">Direccion</label><input id="direccion" class="form-control" th:field="*{direccion}" required></div>
                        <div class="mb-3"><label class="form-label" for="password">Contraseña</label><input id="password" class="form-control" th:field="*{password}" required></div>
                        <button class="btn btn-primary w-100" type="submit">Guardar persona</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Registros</h2><input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar correo"></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPersonas">
                            <thead><tr><th>Id</th><th>Nombre</th><th>Apellido Paterno</th><th>Apellido Materno</th><th>Fecha de Nacimiento</th><th>Correo Electrónico</th><th>Telefono</th><th>Direccion</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="item : ${personas}">
                                    <td th:text="${item.id}"></td><td th:text="${item.nombre}"></td><td th:text="${item.apellidoPaterno}"></td><td th:text="${item.apellidoMaterno}"></td><td th:text="${item.fechaNacimiento}"></td><td th:text="${item.correoElectronico}"></td><td th:text="${item.telefono}"></td><td th:text="${item.direccion}"></td>
                                    <td class="text-end text-nowrap">
                                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${item.id}">Editar</button>
                                        <form class="d-inline" th:action="@{/vista/personas/{id}/eliminar(id=${item.id})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Eliminar esta persona?')">Eliminar</button></form>
                                    </td>
                                    <div class="modal fade" th:id="'editar-' + ${item.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog"><div class="modal-content"><form th:action="@{/vista/personas/{id}/actualizar(id=${item.id})}" method="post">
                                            <div class="modal-header"><h3 class="modal-title fs-5">Editar persona</h3><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                            <div class="modal-body">

                                                <div class="mb-3">
                                                    <label class="form-label">Nombre</label>
                                                    <input class="form-control"
                                                        name="nombre"
                                                        type="text"
                                                        th:value="${item.nombre}"
                                                        required>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Apellido Paterno</label>
                                                    <input class="form-control"
                                                        name="apellidoPaterno"
                                                        type="text"
                                                        th:value="${item.apellidoPaterno}"
                                                        required>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Apellido Materno</label>
                                                    <input class="form-control"
                                                        name="apellidoMaterno"
                                                        type="text"
                                                        th:value="${item.apellidoMaterno}"
                                                        required>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Fecha de Nacimiento</label>
                                                    <input class="form-control"
                                                        name="fechaNacimiento"
                                                        type="date"
                                                        th:value="${item.fechaNacimiento}"
                                                        required>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Correo Electrónico</label>
                                                    <input class="form-control"
                                                        name="correoElectronico"
                                                        type="email"
                                                        th:value="${item.correoElectronico}"
                                                        required>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Teléfono</label>
                                                    <input class="form-control"
                                                        name="telefono"
                                                        type="tel"
                                                        th:value="${item.telefono}"
                                                        required>
                                                </div>

                                                <div class="mb-3">
                                                    <label class="form-label">Dirección</label>
                                                    <input class="form-control"
                                                        name="direccion"
                                                        type="text"
                                                        th:value="${item.direccion}"
                                                        required>
                                                </div>

                                            </div>
                                            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
                                        </form></div></div>
                                    </div>
                                </tr>
                                <tr th:if="${#lists.isEmpty(personas)}"><td colspan="6" class="text-center text-secondary py-4">No hay personas registradas.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPersonas tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
